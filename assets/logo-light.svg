<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" fill="none">
  <!-- Magnifying glass circle -->
  <circle cx="30" cy="30" r="18" stroke="#F3EFE7" stroke-width="3.5" fill="none"/>
  <!-- Magnifying glass handle (angled bottom-left) -->
  <rect x="40" y="44" width="3.5" height="16" rx="1.75" fill="#F3EFE7" transform="rotate(-45 42 44)"/>
  <!-- Trend arrow line (zigzag going up-right, in violet-light) -->
  <polyline points="16,42 24,34 30,38 42,20" stroke="#CDB9F6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Arrowhead -->
  <polyline points="36,19 43,19 42,26" stroke="#CDB9F6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- OrganicReachSEO text -->
  <text x="72" y="52" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="46" fill="#F3EFE7" letter-spacing="-0.5">OrganicReachSEO</text>
</svg>
